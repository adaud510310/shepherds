<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/253.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>باقات الرعاية للموسم 2025-2026</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        font-family: "Tajawal", sans-serif;
        direction: rtl;
        text-align: right;
      }

      .top-bar {
        background: #1a1a1a;
        color: white;
        padding: 10px 0;
      }

      .top-bar .nav-link {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-size: 14px;
      }

      .top-bar .nav-link:hover {
        color: #ff6b35;
      }

      .logo-wr img {
        height: 50px;
      }

      .inner-banner {
        position: relative;
        height: 300px;
        background: linear-gradient(135deg, #2c2c2c 0%, #8b0000 100%);
        display: flex;
        align-items: center;
        color: white;
      }

      .page-title {
        font-size: 2.5rem;
        font-weight: bold;
      }

      .image {
        margin: 20px 0;
        text-align: center;
      }

      .image img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .site-footer {
        background: #1a1a1a;
        color: white;
        margin-top: 50px;
      }

      .footer-top {
        background: linear-gradient(rgba(48, 47, 47, 0.8), rgba(0, 0, 0, 0.8)),
          url("/02.jpg");
        background-size: cover;
        background-position: center;
        padding: 40px 0;
      }

      .f-body {
        padding: 40px 0;
      }

      .f-list .item {
        color: #ccc;
        text-decoration: none;
        display: block;
        margin: 8px 0;
      }

      .f-list .item:hover {
        color: #ff6b35;
      }

      .icons-wr a {
        color: white;
        font-size: 20px;
        margin: 0 10px;
        text-decoration: none;
      }

      .icons-wr a:hover {
        color: #ff6b35;
      }

      .f-bottom {
        background: #000;
        padding: 20px 0;
        border-top: 3px solid #ff6b35;
      }

      .orange-line {
        height: 3px;
        background: #ff6b35;
      }

      .spons img {
        height: 40px;
        margin-right: 15px;
      }

      .btn.lang {
        background: white;
        color: #333;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
      }

      .btn.lang:hover {
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
